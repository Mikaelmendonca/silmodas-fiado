<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0f5">
  <title>Silmodas · Fiado</title>
  <style>
    :root {
      --bg:#fbf6f8; --card:#ffffff; --ink:#1d1d1f; --muted:#86868b; --line:rgba(29,29,31,.08);
      --accent:#e0457b; --accent-strong:#c9316a; --accent-soft:#fde7ef; --accent-ink:#b02456;
      --grad:linear-gradient(135deg,#ff7aa8 0%,#e0457b 55%,#c9316a 100%);
      --red:#d92d4a; --red-soft:#fde8ec;
      --amber:#b45309; --amber-soft:#fff2dc;
      --green:#1a8a5a; --green-soft:#e3f6ec;
      --nav:rgba(251,246,248,.72); --shadow:0 1px 2px rgba(60,20,40,.04), 0 8px 24px rgba(60,20,40,.06);
      --radius:22px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#120c10; --card:#1c1419; --ink:#f5f5f7; --muted:#a1a1a6; --line:rgba(255,255,255,.09);
        --accent:#ff6b9d; --accent-strong:#ff8fb5; --accent-soft:#3a1a29; --accent-ink:#ffb3cd;
        --grad:linear-gradient(135deg,#ff8fb5 0%,#ff5c92 55%,#d63d78 100%);
        --red:#ff7085; --red-soft:#3a1720; --amber:#ffb454; --amber-soft:#382612;
        --green:#4fd394; --green-soft:#12301f;
        --nav:rgba(18,12,16,.72); --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0; color:var(--ink); background:var(--bg);
      background-image:radial-gradient(1000px 420px at 85% -120px, var(--accent-soft), transparent 70%);
      background-repeat:no-repeat;
      font:17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    /* Barra superior translúcida, como no site da Apple */
    .nav { position:sticky; top:0; z-index:10; background:var(--nav); border-bottom:1px solid var(--line);
           -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); }
    .nav-in { max-width:820px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:10px; }
    .logo { width:26px; height:26px; border-radius:8px; background:var(--grad); color:#fff; display:grid;
            place-items:center; font-weight:700; font-size:.9rem; }
    .brand { font-weight:600; letter-spacing:-.01em; }

    main { max-width:820px; margin:0 auto; padding:0 20px 72px; }

    .hero { padding:44px 0 28px; }
    .eyebrow { margin:0 0 6px; color:var(--accent); font-weight:600; font-size:.95rem; letter-spacing:.01em; }
    h1 { margin:0; font-size:clamp(2.1rem, 7vw, 3.4rem); line-height:1.05; letter-spacing:-.035em; font-weight:700; }
    h1 span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .lead { margin:14px 0 0; max-width:34ch; color:var(--muted); font-size:1.15rem; line-height:1.4; }

    h2 { margin:40px 0 14px; font-size:1.6rem; letter-spacing:-.025em; font-weight:700; }

    .card { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
    .muted { color:var(--muted); font-size:.92rem; }

    /* Resumo */
    .summary { display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:14px; }
    .tile { background:var(--card); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
    .tile .muted { display:block; }
    .tile b { display:block; margin-top:4px; font-size:clamp(1.5rem, 5vw, 2.1rem); line-height:1.1; letter-spacing:-.03em; }
    .tile.primary { background:var(--grad); color:#fff; box-shadow:0 10px 30px rgba(224,69,123,.32); }
    .tile.primary .muted { color:rgba(255,255,255,.85); }
    .tile.late b { color:var(--red); }

    /* Alertas no celular */
    .alerts { margin-top:14px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; }
    #alert-status { display:flex; gap:10px; align-items:flex-start; flex:1 1 280px; font-size:.98rem; }
    #alert-status::before { content:""; flex:none; width:10px; height:10px; border-radius:50%; margin-top:.5em; background:var(--muted); }
    #alert-status.on::before { background:var(--green); box-shadow:0 0 0 4px var(--green-soft); }
    #alert-status.off::before { background:var(--amber); box-shadow:0 0 0 4px var(--amber-soft); }
    #alert-status.on { color:var(--ink); } #alert-status.off { color:var(--ink); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    /* Botões em pílula */
    button, a.btn { font:inherit; font-size:.95rem; font-weight:500; min-height:40px; padding:0 18px; border:0; border-radius:999px;
                    background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; display:inline-flex;
                    align-items:center; justify-content:center; transition:transform .12s ease, background .15s ease, opacity .15s; }
    button:hover, a.btn:hover { background:var(--accent-strong); }
    button:active, a.btn:active { transform:scale(.97); }
    button.ghost, a.btn { background:var(--accent-soft); color:var(--accent-ink); }
    button.ghost:hover, a.btn:hover { background:var(--accent-soft); opacity:.8; }
    button.danger { background:transparent; color:var(--muted); padding:0 12px; }
    button.danger:hover { background:var(--red-soft); color:var(--red); }
    :focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset:2px; }

    /* Cartão de fiado */
    .debt { display:grid; grid-template-columns:auto 1fr auto; gap:6px 16px; align-items:center; margin-bottom:12px; }
    .avatar { width:46px; height:46px; border-radius:50%; background:var(--grad); color:#fff; display:grid;
              place-items:center; font-weight:600; font-size:1.15rem; grid-row:span 1; }
    .who { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .who strong { font-size:1.08rem; letter-spacing:-.01em; }
    .owed { margin-top:2px; }
    .owed strong { font-size:1.15rem; letter-spacing:-.02em; }
    .bar { height:6px; border-radius:99px; background:var(--accent-soft); overflow:hidden; margin-top:8px; }
    .bar i { display:block; height:100%; background:var(--grad); border-radius:99px; }
    .badge { font-size:.78rem; font-weight:600; padding:3px 10px; border-radius:999px; }
    .badge.overdue { color:var(--red); background:var(--red-soft); }
    .badge.due_today { color:var(--amber); background:var(--amber-soft); }
    .badge.paid { color:var(--green); background:var(--green-soft); }
    .badge.pending { color:var(--accent-ink); background:var(--accent-soft); }
    .empty { text-align:center; color:var(--muted); padding:28px 20px; }

    /* Formulário */
    form.card { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:24px; }
    form .full { grid-column:1 / -1; }
    label { display:grid; gap:6px; font-size:.85rem; font-weight:500; color:var(--muted); }
    input { font:inherit; font-size:1rem; color:var(--ink); min-height:48px; padding:0 14px; border:1px solid var(--line);
            border-radius:14px; background:var(--bg); transition:border-color .15s, box-shadow .15s, background .15s; width:100%; }
    input::placeholder { color:color-mix(in srgb, var(--muted) 70%, transparent); }
    input:focus { outline:none; border-color:var(--accent); background:var(--card); box-shadow:0 0 0 4px var(--accent-soft); }
    input[type=number]::-webkit-inner-spin-button { display:none; }
    form button[type=submit] { min-height:50px; padding:0 28px; font-size:1.02rem; }

    /* Aviso (toast) */
    #msg { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:20;
           max-width:calc(100vw - 32px); padding:12px 20px; border-radius:999px; font-weight:500; font-size:.95rem; color:#fff;
           background:#1d1d1f; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    #msg:empty { display:none; }
    #msg.ok { background:var(--green); } #msg.err { background:var(--red); }

    @media (max-width:640px) {
      body { font-size:16px; }
      .hero { padding:32px 0 22px; }
      .summary { grid-template-columns:1fr 1fr; }
      .tile.primary { grid-column:1 / -1; }
      h2 { font-size:1.4rem; margin-top:34px; }
      .debt { grid-template-columns:auto 1fr; }
      .debt .actions { grid-column:1 / -1; }
      form.card { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
<header class="nav"><div class="nav-in"><span class="logo" aria-hidden="true">S</span><span class="brand">Silmodas</span></div></header>
<main>
  <section class="hero">
    <p class="eyebrow">Controle de fiado</p>
    <h1>Cada prazo,<br><span>no seu tempo.</span></h1>
    <p class="lead">Anote o que foi vendido a prazo e receba um aviso no celular quando o vencimento chegar.</p>
  </section>
  <div id="msg" role="status" aria-live="polite"></div>

  <section class="summary" aria-label="Resumo">
    <div class="tile primary"><span class="muted">Total a receber</span><b id="s-open" data-testid="total-open">R$ 0,00</b></div>
    <div class="tile late"><span class="muted">Atrasado</span><b id="s-overdue" data-testid="total-overdue">R$ 0,00</b></div>
    <div class="tile"><span class="muted">Vencem hoje</span><b id="s-today" data-testid="due-today-count">0</b></div>
  </section>

  <section class="card alerts" aria-label="Alertas no celular">
    <div id="alert-status" data-testid="alert-status" class="muted">Carregando…</div>
    <div class="actions">
      <button type="button" id="btn-test" class="ghost">Testar no celular</button>
      <button type="button" id="btn-run" class="ghost">Enviar alertas de hoje</button>
    </div>
  </section>

  <h2>Cobrar agora</h2>
  <div id="reminders" data-testid="reminders"></div>

  <h2>Novo fiado</h2>
  <form id="new-debt" class="card">
    <label>Cliente <input name="customer" required maxlength="120" autocomplete="off"></label>
    <label>Telefone (WhatsApp) <input name="phone" inputmode="tel" placeholder="(11) 91234-5678"></label>
    <label class="full">O que levou <input name="description" maxlength="300" placeholder="Vestido, blusa, sandália…"></label>
    <label class="full">Valor (R$) <input name="amount" inputmode="decimal" required placeholder="300,00"></label>
    <label>Prazo (dias) <input name="term_days" type="number" min="0" max="3650" inputmode="numeric" placeholder="30"></label>
    <label>Vencimento <input name="due_date" type="date" required></label>
    <div class="full"><button type="submit">Anotar fiado</button></div>
  </form>

  <h2>Todos os fiados</h2>
  <div id="all" data-testid="all-debts"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const brl = (c) => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const LABEL = { overdue: "Atrasado", due_today: "Vence hoje", pending: "No prazo", paid: "Pago" };

let flashTimer;
function flash(text, kind) {
  const m = $("#msg"); m.textContent = text; m.className = kind;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { m.textContent = ""; m.className = ""; }, 4500);
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : "Confira os dados informados.");
  }
  return data;
}

// Converte "12,50" ou "1.250,00" em centavos, sem usar float para o valor final.
function parseCents(text) {
  const clean = text.trim().replace(/\./g, "").replace(",", ".");
  if (!/^\d+(\.\d{1,2})?$/.test(clean)) return null;
  const [r, c = ""] = clean.split(".");
  return parseInt(r, 10) * 100 + parseInt(c.padEnd(2, "0"), 10);
}

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  n.append(...kids);
  return n;
}

function debtCard(d) {
  const due = d.due_date.split("-").reverse().join("/");
  const info = el("div", {},
    el("div", { className: "who" },
      el("strong", { textContent: d.customer }),
      el("span", { className: `badge ${d.status}`, textContent: LABEL[d.status] +
        (d.days_overdue ? ` · ${d.days_overdue}d` : "") })),
    el("div", { className: "muted",
      textContent: `${d.description || "—"} · vence ${due} (prazo de ${d.term_days}d)` }),
    el("div", { className: "owed" }, "Falta ",
      el("strong", { textContent: brl(d.remaining_cents) }),
      el("span", { className: "muted", textContent: ` de ${brl(d.amount_cents)}` })));
  if (d.paid_cents > 0 && d.status !== "paid") {
    const pct = Math.round((d.paid_cents / d.amount_cents) * 100);
    const fill = el("i"); fill.style.width = `${pct}%`;
    info.append(el("div", { className: "bar", title: `${pct}% já foi pago` }, fill));
  }
  const actions = el("div", { className: "actions" });
  if (d.whatsapp_url && d.status !== "paid")
    actions.append(el("a", { className: "btn", href: d.whatsapp_url, target: "_blank",
      rel: "noopener", textContent: "Cobrar no WhatsApp" }));
  if (d.status !== "paid")
    actions.append(el("button", { textContent: "Registrar pagamento", onclick: () => pay(d) }));
  actions.append(el("button", { className: "danger", textContent: "Apagar", onclick: () => remove(d) }));
  const avatar = el("div", { className: "avatar", textContent: d.customer.trim().charAt(0).toUpperCase(), ariaHidden: "true" });
  const card = el("div", { className: "card debt" }, avatar, info, actions);
  card.dataset.testid = "debt-card";
  return card;
}

function fill(target, debts, emptyText) {
  target.replaceChildren(...(debts.length ? debts.map(debtCard)
    : [el("div", { className: "card empty", textContent: emptyText })]));
}

async function refresh() {
  const [rem, all, sum] = await Promise.all([api("/reminders"), api("/debts"), api("/summary")]);
  fill($("#reminders"), rem, "Nada para cobrar hoje 🎉");
  fill($("#all"), all, "Nenhum fiado anotado ainda.");
  $("#s-open").textContent = brl(sum.total_open_cents);
  $("#s-overdue").textContent = brl(sum.total_overdue_cents);
  $("#s-today").textContent = sum.due_today_count;
}

// --- Alertas no celular ---
async function loadAlertStatus() {
  const st = await api("/alerts/status");
  const box = $("#alert-status");
  if (st.push_enabled) {
    box.className = "on";
    box.textContent = `Alertas no celular ligados: todo dia às ${st.alert_time}, ` +
      `no vencimento e ${st.warn_days.join(" e ")} dia(s) antes.`;
  } else {
    box.className = "off";
    box.textContent = "Alertas no celular desligados. Configure o FIADO_NTFY_TOPIC (veja o README).";
  }
}

$("#btn-test").addEventListener("click", async () => {
  try {
    const r = await api("/alerts/test", { method: "POST" });
    flash(r.push_enabled ? "Notificação de teste enviada!" : "Sem tópico configurado: só registrei no log.", r.push_enabled ? "ok" : "err");
  } catch (e) { flash(e.message, "err"); }
});

$("#btn-run").addEventListener("click", async () => {
  try {
    const r = await api("/alerts/run", { method: "POST" });
    flash(r.sent || r.failed ? `${r.sent} alerta(s) enviado(s), ${r.failed} falha(s).` : "Nada novo para avisar agora.", r.failed ? "err" : "ok");
  } catch (e) { flash(e.message, "err"); }
});

// --- Prazo (dias) e vencimento andam juntos ---
const ymd = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
const startOfToday = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const termInput = document.querySelector('[name="term_days"]');
const dueInput = document.querySelector('[name="due_date"]');
dueInput.min = ymd(startOfToday());
termInput.addEventListener("input", () => {
  const n = parseInt(termInput.value, 10);
  if (Number.isNaN(n) || n < 0) return;
  const t = startOfToday(); t.setDate(t.getDate() + n);
  dueInput.value = ymd(t);
});
dueInput.addEventListener("input", () => {
  if (!dueInput.value) return;
  const [y, m, d] = dueInput.value.split("-").map(Number);
  termInput.value = Math.round((new Date(y, m - 1, d) - startOfToday()) / 86400000);
});

async function pay(d) {
  const text = prompt(`Quanto ${d.customer} pagou? (falta ${brl(d.remaining_cents)})`,
    (d.remaining_cents / 100).toFixed(2).replace(".", ","));
  if (text === null) return;
  const cents = parseCents(text);
  if (cents === null) return flash("Valor inválido.", "err");
  try {
    await api(`/debts/${d.id}/payments`, { method: "POST", body: JSON.stringify({ amount_cents: cents }) });
    flash("Pagamento registrado.", "ok"); await refresh();
  } catch (e) { flash(e.message, "err"); }
}

async function remove(d) {
  if (!confirm(`Apagar o fiado de ${d.customer}?`)) return;
  try { await api(`/debts/${d.id}`, { method: "DELETE" }); await refresh(); }
  catch (e) { flash(e.message, "err"); }
}

$("#new-debt").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const cents = parseCents(f.get("amount"));
  if (cents === null) return flash("Valor inválido. Use o formato 12,50.", "err");
  try {
    await api("/debts", { method: "POST", body: JSON.stringify({
      customer: f.get("customer"), phone: f.get("phone") || null,
      description: f.get("description"), amount_cents: cents, due_date: f.get("due_date") }) });
    ev.target.reset(); flash("Fiado anotado!", "ok"); await refresh();
  } catch (e) { flash(e.message, "err"); }
});

refresh().catch((e) => flash(e.message, "err"));
loadAlertStatus().catch((e) => flash(e.message, "err"));
</script>
</body>
</html>
