[project]
name = "fiado"
version = "0.1.0"
description = "Silmodas: controle de fiado com alertas de vencimento no celular"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mikael Mendonça" }]
keywords = ["fiado", "cobranca", "fastapi", "ntfy", "pytest", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.4", "mypy>=1.10", "pytest-playwright>=0.5"]

[project.urls]
Repository = "https://github.com/Mikaelmendonca/silmodas-fiado"
Issues = "https://github.com/Mikaelmendonca/silmodas-fiado/issues"

[project.scripts]
fiado = "fiado.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fiado = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# E2E (navegador real) ficam de fora do `pytest` padrão: rode com `make e2e`.
addopts = "-ra --strict-markers -m 'not e2e' --cov=fiado --cov-report=term-missing --cov-fail-under=95"
markers = [
    "unit: testes rápidos de regra de negócio",
    "api: testes de contrato/fluxo da API HTTP",
    "e2e: testes ponta a ponta no navegador (Playwright)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
strict = true
